<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applied synchronously, before the first paint, so a saved "light"/"dark" choice never
      // flashes the other theme for a frame - a plain "system" choice (no stored value) leaves
      // the attribute unset and the stylesheet's prefers-color-scheme media query decides instead.
      (function () {
        try {
          var stored = localStorage.getItem("acc-tidp-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          // Storage blocked (private window, locked-down policy) - falls back to the OS preference.
        }
      })();
    </script>
    <!-- No square icon-shaped mark is available in client/public/ right now (only the wide
         "OBMI Wordmark" lockup, ~5.3:1) - browsers will letterbox it into the tab icon rather
         than stretch it, which is legible but not crisp. Swap this for a proper square favicon
         (e.g. a 32x32/64x64 PNG of just the "O" mark) whenever one's available. -->
    <link rel="icon" type="image/png" href="/obmi-wordmark-navy.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;600;700;800&family=Montserrat:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <title>OBMI · ACC Files Log vs TIDP/MIDP Checker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
